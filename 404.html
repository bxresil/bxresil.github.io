<script>
// old or guessed addresses such as /projects or /cv go to the matching part of the site
(function () {
  var p = location.pathname.toLowerCase().replace(/\.html?$/, '').replace(/^\/+|\/+$/g, '');
  var pages = ['about', 'projects', 'publications', 'optics', 'experience', 'photography', 'contact'];
  if (p === 'cv' || p === 'resume') location.replace('/assets/Bingxi_Li_CV.pdf');
  else if (pages.indexOf(p) >= 0) location.replace('/#' + p);
})();
</script>
